name: Deploy to Salesforce

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Salesforce CLI
        run: npm install @salesforce/cli --global

      - name: Authenticate to Salesforce
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" | sf org login sfdx-url --alias arcX --sfdx-url-stdin

      - name: Verify Org Authentication
        run: sf org list

      - name: Deploy to Salesforce
        run: |
          sf project deploy start --source-dir force-app -o arcX